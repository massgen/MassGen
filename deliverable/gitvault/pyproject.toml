[project]
name = "gitvault"
version = "0.1.0"
description = "GitVault: a GitHub-inspired full-stack platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "jinja2>=3.1.4",
  "markdown>=3.7",
  "pyyaml>=6.0.2",
  "python-multipart>=0.0.20",
  "uvicorn>=0.35.0",
  "httpx>=0.28.1",
  "itsdangerous>=2.2.0"
]

[dependency-groups]
dev = [
  "pytest>=8.4.0"
]

[tool.pytest.ini_options]
addopts = "-q"

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gitvault*"]
