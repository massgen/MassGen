  # Incremental mypy "ratchet": type-check only a curated island of clean modules
  # (full-repo mypy is not yet feasible — ~2300 errors). Expand ISLAND in
  # scripts/mypy_island.sh as modules get typed. A non-blocking full-repo mypy
  # job runs in CI for visibility.
  - repo: local
    hooks:
      - id: mypy-island
        name: mypy (type-checked island)
        entry: bash scripts/mypy_island.sh
        language: system
        pass_filenames: false
        files: ^(massgen/agent_config\.py|massgen/backend/_excluded_params\.py|massgen/cli/(_constants|env|mode_flags|planning)\.py|scripts/mypy_island\.sh)$
  - repo: https://github.com/regebro/pyroma
    rev: "5.0.1"
    hooks:
      - id: pyroma
        args: [.]
  - repo: local
    hooks:
      - id: run-non-api-tests-on-push
        name: Run non-API test lane before push
        entry: sh -c 'uv run pytest massgen/tests --run-integration -m "not live_api and not docker and not expensive and not snapshot" -q --tb=no'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: sync-agent-instructions
        name: Keep CLAUDE.md and AGENTS.md synchronized
        entry: python scripts/precommit_sync_agent_instructions.py
        language: system
        files: ^(CLAUDE|AGENTS)\.md$
        pass_filenames: false
      # Need to fix locally
      # - id: validate-configs
      #   name: Validate MassGen configuration files
      #   entry: python scripts/precommit_validate_configs.py
      #   language: system
      #   files: ^massgen/configs/.*\.(yaml|yml)$
      #   exclude: ^massgen/configs/rate_limits/
      #   pass_filenames: true
      - id: sync-readme-pypi
        name: Auto-sync README_PYPI.md when README.md changes
        entry: python scripts/precommit_sync_readme.py
        language: system
        files: ^README\.md$
        pass_filenames: false
      - id: check-package-name
        name: Ensure package name is "massgen" in pyproject.toml
        entry: python scripts/precommit_check_package_name.py
        language: system
        files: ^pyproject\.toml$
        pass_filenames: false
