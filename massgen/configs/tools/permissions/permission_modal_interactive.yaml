# Permissions — interactive approval MODAL demo (self-contained, benign).
#
# Same engine as permission_engine.yaml, but display_type: textual_terminal so a
# per-tool `ask` pops the interactive approval modal (Allow once/session/always |
# Reject) instead of being resolved by the automation policy.
#
# Two ways to run (no setup needed — the workspace is created automatically):
#
#   INTERACTIVE (modal):    a high-risk command pops the approval modal.
#     uv run massgen --config massgen/configs/tools/permissions/permission_modal_interactive.yaml \
#       "Run the shell command: curl -s https://example.com"
#     → expect an approval modal; try Allow once / session / always / Reject.
#     → click "Always" then re-run the SAME command to see it NOT re-prompt
#       (a persisted allow rule is written to .massgen/settings.local.json).
#
#   AUTOMATION (no human):  the same ask is resolved by automation_default instead.
#     uv run massgen --automation --config massgen/configs/tools/permissions/permission_modal_interactive.yaml \
#       "Run two commands and report each: (1) echo HELLO_OK  (2) echo BLOCKED_secret"
#     → (1) echoes (low risk → allow); (2) blocked by the deny rule below.
#
# Safety: only benign commands are suggested above. `curl https://example.com` is a
# harmless fetch even if approved; `echo` is inert. No destructive operations.

agents:
  - id: "guarded"
    backend:
      # Gemini reliably ISSUES the tool call, so the approval modal actually fires.
      # (gpt-5-nano tended to answer without attempting the command → no modal.)
      type: "gemini"
      model: "gemini-3-flash-preview"
      cwd: "permission_demo_workspace"     # created automatically; relative → portable
      enable_mcp_command_line: true
      permissions:
        enabled: true
        automation_default: "risk-based"   # used only under --automation (no human)
        audit: true                        # append-only ledger at .massgen/approvals/ledger.jsonl
        # max_consecutive_auto: 25         # runaway-loop guard (omit → unlimited)
        # persist_approvals: true          # 'Always' grants persist + load back (default on)
        rules:
          deny:
            - "command(echo BLOCKED*)"     # deterministic deny for the automation demo
            - "command(git push --force*)"
          ask:
            - "read_url(*)"                # any network fetch → approval modal

orchestrator:
  snapshot_storage: "snapshots"
  agent_temporary_workspace: "temp_workspaces"

ui:
  display_type: "textual_terminal"         # the Textual TUI that hosts the approval modal
  logging_enabled: true
