# SRT Sandboxing — OS-level command execution sandbox
#
# Enables Anthropic's sandbox-runtime (SRT: bubblewrap on Linux, Seatbelt on
# macOS) for an agent's command/code execution. SRT enforces BOTH filesystem and
# network isolation at the OS level, derived from the SAME path-permission policy
# as MassGen's application-level permission layer (defense in depth).
#
# This is the right sandbox for backends that run commands through MassGen's
# command-line MCP (OpenAI/Claude/Gemini/Grok API backends). Native-sandbox
# backends (codex `--full-auto`, claude_code) use their own and don't need this.
#
# Prerequisite (one-time):
#   npm install -g @anthropic-ai/sandbox-runtime
#
# Turn it on with ONE knob: `command_line_execution_mode: srt`.
#
# Run with:
#   uv run massgen --automation --config massgen/configs/tools/filesystem/sandbox/srt_sandbox.yaml \
#     "Create out.txt in the workspace, then try to read ~/.ssh/id_rsa"
# Expected: the workspace write succeeds; reading ~/.ssh (or anything else in your
# home dir outside the workspace/context) and all network egress are denied.

agents:
  - id: "sandboxed"
    backend:
      type: "openai"
      model: "gpt-5"

      cwd: "workspace_sandboxed"
      enable_mcp_command_line: true

      # ▼▼▼ The single opt-in knob ▼▼▼
      command_line_execution_mode: "srt"

      # ── Optional SRT knobs (all default-safe) ──────────────────────────────
      # READ confinement. Default "confined": denies all of $HOME (personal data,
      # secrets, other projects) and re-allows only the workspace + context paths;
      # system paths (/usr, /opt, …) stay readable so commands run.
      #   confined (default) — deny $HOME, allow workspace+context (+ allow_read)
      #   strict            — deny "/", allow only workspace+context+system+extras
      #   open              — allow-all reads except a built-in secret denylist
      # command_line_srt_read_mode: "confined"
      #
      # Extra paths the sandboxed commands may READ (e.g. a shared cache the
      # interpreter needs, or a data dir outside the workspace):
      # command_line_srt_allow_read:
      #   - "~/.cache/uv"
      #
      # Network is DENY-ALL by default. Each allowlisted domain is a capability
      # grant (an allowlisted domain can be an exfiltration channel), so add only
      # what the sandboxed commands genuinely need:
      # command_line_srt_network_allowed_domains:
      #   - "pypi.org"
      #   - "files.pythonhosted.org"
      #
      # Extra paths to block from reading (effective outside the allow-read region):
      # command_line_srt_deny_read:
      #   - "/opt/secret-data"
      #
      # Unix sockets to allow (advanced; e.g. a local service):
      # command_line_srt_allow_unix_sockets: []

orchestrator:
  snapshot_storage: "snapshots"
  agent_temporary_workspace: "temp_workspaces"

ui:
  display_type: "rich_terminal"
  logging_enabled: true
